[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vox-deck"
version = "0.1.0"
description = "Soundboard and real-time voice changer with a virtual microphone for PipeWire"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6", "numpy"]

[project.scripts]
vox-deck = "voxdeck.cli:main"
vox-deck-gui = "voxdeck.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxdeck = ["builtin_presets.json"]
